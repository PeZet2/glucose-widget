changelog:
  exclude:
    labels:
      - internal

  categories:
    - title: "🚨 Breaking Changes"
      labels:
        - breaking-change

    - title: "✨ Features"
      labels:
        - enhancement

    - title: "🐛 Bug Fixes"
      labels:
        - bug

    - title: "📦 Dependencies"
      labels:
        - dependency

    - title: "📚 Documentation"
      labels:
        - documentation

    - title: "🔧 Other Changes"
      labels:
        - "*"