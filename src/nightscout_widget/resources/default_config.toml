# Nightscout Widget - user configuration
# The file is created on first launch at:
#   %APPDATA%\NightscoutWidget\config.toml
# After changing it, choose "Reload configuration" in the tray or restart the application.

[nightscout]
# Main URL of your Nightscout instance, without the trailing /api/v1.
base_url = "https://YOUR-NIGHTSCOUT.example.com"

# auto       - access_token first, then api_secret; if both are empty: no login
# token      - requires access_token in secrets.toml
# api_secret - requires api_secret in secrets.toml
# none       - no authentication, for public instances only
# Recommended option: read-only access token with auto or token mode.
auth_mode = "auto"

# Do not disable this for a regular public HTTPS domain.
verify_tls = true

[network]
# 2 minutes by default.
poll_interval_seconds = 120
request_timeout_seconds = 10

# After an error, up to 3 ADDITIONAL attempts will be made,
# each after 15 seconds. Once they are exhausted, the application returns
# to the regular poll_interval_seconds interval.
retry_delay_seconds = 15
max_retries = 3

[glucose]
# Thresholds use the unit configured in display_unit.
display_unit = "mg/dL"  # allowed: "mg/dL" or "mmol/L"
low = 70
high = 180

# Delta relative to the Nth previous reading.
# The code always limits this value to the 1-10 range.
delta_lookback = 1

# A reading older than this limit is marked as stale.
stale_after_minutes = 15

[widget]
# The default size roughly matches the red frame in the example screenshot.
width = 172
height = 100

# Range 0.20-1.00. The background is transparent; text remains readable.
opacity = 0.94

# The lock state is saved in state.json.
start_locked = false
always_on_top = true
show_reading_time = true

[alarm]
# The alarm is a system sound and/or a tray notification.
enabled = false
sound = true
tray_notification = true

# 0 = alert only when entering LOW/HIGH or switching LOW<->HIGH.
# A value > 0 repeats the alert after that many minutes while the state persists.
repeat_minutes = 10
