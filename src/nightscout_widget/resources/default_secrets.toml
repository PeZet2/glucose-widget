# Nightscout Widget - dane dostępowe
# Ten plik zawiera sekrety w postaci jawnego tekstu. Nie commituj go do Git.
# Najbezpieczniej użyć osobnego tokenu tylko do odczytu (rola readable).

[nightscout]
# Przykład tokenu: school-a595d5f0aeff64c0
# Możesz wkleić sam token albo wartość zaczynającą się od "token=".
access_token = ""

# Alternatywa dla access_token. Wklej surowy API_SECRET;
# aplikacja sama policzy wymagany skrót SHA-1.
api_secret = ""

# Ustaw true wyłącznie wtedy, gdy powyżej wklejasz już gotowy,
# 40-znakowy hash SHA-1 zamiast surowego API_SECRET.
api_secret_is_sha1 = false
