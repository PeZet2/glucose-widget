# Glucose Widget - credentials
# This file contains secrets in plain text. Do not commit it to Git.
# The safest option is a separate read-only token (readable role).

[nightscout]
# Token example: school-a595d5f0aeff64c0
# You can paste the token itself or a value starting with "token=".
access_token = ""

# Alternative to access_token. Paste the raw API_SECRET;
# the application will calculate the required SHA-1 hash.
api_secret = ""

# Set to true only when you paste an already computed,
# 40-character SHA-1 hash instead of the raw API_SECRET.
api_secret_is_sha1 = false
