[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "glucose-widget"
version = "0.4.0"
description = "Small always-on-top Nightscout glucose widget for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Glucose Widget" }]
dependencies = [
    "httpx>=0.27,<1",
    "platformdirs>=4.3,<5",
    "PySide6-Essentials>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]
build = [
    "pyinstaller>=6.11,<7",
]

[project.scripts]
glucose-widget = "glucose_widget.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"glucose_widget.resources" = ["*.toml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
